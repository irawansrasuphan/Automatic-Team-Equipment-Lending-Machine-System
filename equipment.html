<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>เลือกช่อง | ตู้ยืมอุปกรณ์กีฬา</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/equipment.css" />
  </head>
  <body>
    <main class="page page-equip">
      <!-- ส่วนหัว: ปุ่มย้อนกลับ ชื่ออุปกรณ์ และตำแหน่งช่อง -->
      <header class="equip-header">
        <a
          class="glass icon-btn"
          href="home.html"
          aria-label="ย้อนกลับ"
          data-i18n-aria="common.back"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#0b2a5b"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </a>
        <div>
          <h1 class="equip-title" id="equipName"></h1>
          <p class="equip-position" id="equipPosition"></p>
        </div>
      </header>

      <!-- การ์ดสรุป (JavaScript ใส่ให้) -->
      <section class="glass summary-card" id="summary"></section>

      <!-- การ์ดช่อง 3 ใบ (JavaScript สร้างให้จากไฟล์ data.js) -->
      <div class="slot-list" id="slotList"></div>

      <!-- ข้อความแนะนำท้ายหน้า (กล่องกระจก) -->
      <footer class="glass tip">
        <p class="tip-text" data-i18n="eq.tip">
          เลือกช่องที่ว่างแล้วกด “ยืมช่องนี้” ได้เลย · 1 บัญชียืมได้ 1 อุปกรณ์
        </p>
      </footer>
    </main>

    <!-- ลำดับสำคัญ: common.js และ data.js ต้องมาก่อน equipment.js -->
    <script src="js/common.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/equipment.js"></script>
  </body>
</html>
