<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="home.title">หน้าหลัก | ตู้ยืมอุปกรณ์กีฬา</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <main class="page page-wide">
      <!-- ส่วนหัว: ชื่อตู้ คำทักทาย และปุ่มเมนู -->
      <header class="home-header">
        <div class="home-heading">
          <h1 class="home-title" data-i18n="app.name">ตู้ยืมอุปกรณ์กีฬา</h1>
          <p class="home-greeting" id="greeting"></p>
        </div>
        <button
          type="button"
          class="glass icon-btn"
          id="menuBtn"
          aria-label="เปิดเมนู"
          data-i18n-aria="home.menuAria"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#0b2a5b"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </header>

      <!-- แถบกฎ หรือ กล่อง "คุณกำลังยืมอยู่" (JavaScript ใส่ให้) -->
      <div id="banner"></div>

      <!-- หัวข้อ (JavaScript ใส่ข้อความให้) -->
      <h2 class="section-title" id="sectionTitle"></h2>

      <!-- การ์ดอุปกรณ์ 3 ใบ (JavaScript สร้างให้จากไฟล์ data.js) -->
      <div class="equipment-list" id="equipmentList"></div>

      <!-- ทางลัดไปหน้าประวัติการยืม -->
      <button type="button" class="glass history-link" id="historyBtn">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#0b2a5b"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2" />
        </svg>
        <span data-i18n="hs.title">ประวัติการยืม</span>
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="rgba(11,42,91,.6)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>
    </main>

    <!-- ลำดับสำคัญ: common.js และ data.js ต้องมาก่อน home.js -->
    <script src="js/common.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
